services:
  app:
    build: .
    ports:
      - "8000:8000"

    # 挂载卷：uploads/ 里的 PDF 文件在容器重启后不会丢失
    # FAISS 索引和 session 状态是内存中的，重启后需要重新上传论文触发重建
    volumes:
      - uploads_data:/app/uploads

    # 环境变量（完全可选）
    # 有 .env 文件时自动加载，没有也不报错——用户在前端页面输入 Key 即可
    env_file:
      - path: .env
        required: false

    # 容器崩溃时自动重启（除非手动 docker compose stop）
    restart: unless-stopped

    # 健康检查：每 30 秒检查一次，确保服务真正就绪
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/papers')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s   # 等待服务启动（演示论文初始化需要几秒）

volumes:
  uploads_data:
    driver: local
